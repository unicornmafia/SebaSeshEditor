services:
  sebasesh:
    image: 127.0.0.1:5000/sebasesh:latest
    build:
      context: .
      target: runtime
    ports:
      - "8090:8000"
    environment:
      # SebaShem (machine transliteration and translation), here running on the host.
      SEBASHEM_URL: ${SEBASHEM_URL:-http://host.docker.internal:8000}
    restart: unless-stopped
